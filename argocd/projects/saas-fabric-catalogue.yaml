# Argo CD project for catalogue applications.
#
# Catalogue applications are optional platform capabilities, so this project is
# deliberately narrower than saas-fabric-platform: one namespace, and one
# cluster-scoped kind. A catalogue chart that needs anything more has to be
# re-evaluated rather than silently granted it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: saas-fabric-catalogue
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Optional catalogue workloads offered as SaaS Fabric capabilities.

  sourceRepos:
    - https://github.com/FieldstateNZ/saas-fabric-platform.git
    - https://perses.github.io/helm-charts

  destinations:
    - server: https://kubernetes.default.svc
      namespace: catalogue

  # Namespace only, and only because Argo CD's CreateNamespace=true is itself a
  # cluster-scoped write. Since `destinations` permits exactly one namespace,
  # what these applications can actually create is `catalogue` and nothing else.
  #
  # This was an empty list until a real cluster refused to create the namespace
  # the applications deploy into. Zero cluster-scoped kinds reads as the
  # stronger boundary, and is simply not a workable one.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
