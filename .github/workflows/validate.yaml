name: validate

# A pull request that renders invalid manifests must not be mergeable. No live
# Kubernetes cluster is used: everything here is offline rendering plus schema
# validation.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: Render and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        env:
          KUBECONFORM_VERSION: v0.7.0
          KUSTOMIZE_VERSION: v5.7.1
        run: |
          python -m pip install --quiet pyyaml yamllint

          kubeconform_base=https://github.com/yannh/kubeconform/releases/download
          curl -sSfL "${kubeconform_base}/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

          kustomize_base=https://github.com/kubernetes-sigs/kustomize/releases/download
          kustomize_archive="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "${kustomize_base}/kustomize%2F${KUSTOMIZE_VERSION}/${kustomize_archive}" \
            | sudo tar -xz -C /usr/local/bin kustomize

          kubeconform -v
          kustomize version

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Validate
        run: ./scripts/validate.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Full history: a credential that was committed and later removed is
      # still a leaked credential.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Complements the secret check in scripts/check.py rather than repeating
      # it. That one rejects credential-shaped keys with literal values;
      # gitleaks recognises known credential formats regardless of key name.
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/v${GITLEAKS_VERSION}/${archive}" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks git . --no-banner --redact --verbose

  # The Data API JWT cases need a real Envoy Gateway. They run here, on the
  # runner's Docker, in a kind cluster this job creates and deletes. No cloud
  # resources. The manifest job above does not start a cluster.
  data-api-edge:
    name: Data API JWT edge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          python -m pip install --quiet pyyaml
          curl -fsSL -o kubectl "https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl"
          sudo install kubectl /usr/local/bin/kubectl
          curl -fsSL "https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz" | tar -xz
          sudo install linux-amd64/helm /usr/local/bin/helm
          curl -fsSL -o kind "https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64"
          sudo install kind /usr/local/bin/kind

      - name: Prove JWT acceptance and rejection at the gateway
        run: python3 scripts/data_api_edge_test.py
