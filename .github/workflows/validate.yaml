name: validate

# A pull request that renders invalid manifests must not be mergeable. No live
# Kubernetes cluster is used: everything here is offline rendering plus schema
# validation.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: Render and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        env:
          KUBECONFORM_VERSION: v0.7.0
          KUSTOMIZE_VERSION: v5.7.1
        run: |
          python -m pip install --quiet pyyaml yamllint

          kubeconform_base=https://github.com/yannh/kubeconform/releases/download
          curl -sSfL "${kubeconform_base}/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

          kustomize_base=https://github.com/kubernetes-sigs/kustomize/releases/download
          kustomize_archive="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "${kustomize_base}/kustomize%2F${KUSTOMIZE_VERSION}/${kustomize_archive}" \
            | sudo tar -xz -C /usr/local/bin kustomize

          kubeconform -v
          kustomize version

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Validate
        run: ./scripts/validate.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Full history: a credential that was committed and later removed is
      # still a leaked credential.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Complements the secret check in scripts/check.py rather than repeating
      # it. That one rejects credential-shaped keys with literal values;
      # gitleaks recognises known credential formats regardless of key name.
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/v${GITLEAKS_VERSION}/${archive}" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks git . --no-banner --redact --verbose
