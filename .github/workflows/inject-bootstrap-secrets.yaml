name: Inject bootstrap secrets

# Delivers the credentials that cannot originate inside the cluster.
#
# After the Password generators in applications/core/keycloak-credentials and
# applications/catalogue/grafana-credentials, exactly one secret is left on the
# bootstrap side: the Tailscale OAuth client. Tailscale issues it, so it has to
# be transported, and this is how -- not by someone typing kubectl.
#
# It targets a GitHub environment with required reviewers, so applying a
# credential to a cluster is an approval rather than a command anyone with push
# access can run.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Platform environment to inject into
        required: true
        default: lucentroot
        type: choice
        options:
          - lucentroot

permissions:
  contents: read

concurrency:
  group: inject-bootstrap-secrets-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  inject:
    name: Inject into ${{ inputs.environment }}
    # Gates on the environment's protection rules. Approval happens here.
    environment: ${{ inputs.environment }}
    # The runner on the box itself: the cluster API is tailnet-only and is never
    # exposed publicly, so a hosted runner could not reach it even with
    # credentials.
    runs-on: [self-hosted, lucentroot]
    steps:
      # The environment is created with placeholder values so the plumbing
      # exists before the real credentials do. An unreplaced placeholder must
      # fail here and say so, not sail through and inject a credential that
      # cannot authenticate -- which surfaces later as an operator that will not
      # register, with nothing pointing at the cause.
      - name: Refuse unreplaced placeholders
        env:
          CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          KUBECONFIG_SECRET: ${{ secrets.LUCENTROOT_KUBECONFIG }}
        run: |
          fail=0
          for name in CLIENT_ID CLIENT_SECRET KUBECONFIG_SECRET; do
            eval "value=\${$name}"
            case "$name" in
              CLIENT_ID)         secret_name=TAILSCALE_OAUTH_CLIENT_ID ;;
              CLIENT_SECRET)     secret_name=TAILSCALE_OAUTH_CLIENT_SECRET ;;
              KUBECONFIG_SECRET) secret_name=LUCENTROOT_KUBECONFIG ;;
            esac
            if [ -z "$value" ]; then
              echo "::error::$secret_name is not set on this environment" >&2
              fail=1
            elif [ "${value#replace-me}" != "$value" ]; then
              echo "::error::$secret_name still holds its placeholder value" >&2
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1

      - name: Configure kubeconfig
        env:
          LUCENTROOT_KUBECONFIG: ${{ secrets.LUCENTROOT_KUBECONFIG }}
        run: |
          mkdir -p "$RUNNER_TEMP/kube"
          printf '%s' "$LUCENTROOT_KUBECONFIG" > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      - name: Inject the Tailscale operator OAuth credential
        env:
          CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
        run: |
          kubectl create namespace tailscale --dry-run=client -o yaml | kubectl apply -f -

          # Values are piped as a manifest rather than passed as --from-literal
          # arguments: argv is visible in the runner's process table, and the
          # same habit puts secrets into the API server audit log elsewhere.
          kubectl apply -f - <<MANIFEST
          apiVersion: v1
          kind: Secret
          metadata:
            name: operator-oauth
            namespace: tailscale
          type: Opaque
          data:
            client_id: $(printf '%s' "$CLIENT_ID" | base64 | tr -d '\n')
            client_secret: $(printf '%s' "$CLIENT_SECRET" | base64 | tr -d '\n')
          MANIFEST

      - name: Verify
        run: |
          # Reports shape, never contents.
          kubectl -n tailscale get secret operator-oauth \
            -o jsonpath='{range $k := .data}{$k}{"\n"}{end}' 2>/dev/null \
            || kubectl -n tailscale get secret operator-oauth -o name
          kubectl -n tailscale rollout status deployment/operator --timeout=180s || true
