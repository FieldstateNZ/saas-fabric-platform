# Points the root Application at one environment's directory.
#
# The Git ref the root Application follows is set in each environment's
# bootstrap kustomization, alongside the ref its child Applications follow.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

replacements:
  - source:
      kind: ConfigMap
      name: platform-environment
      fieldPath: data.environment
    targets:
      - select:
          kind: Application
          name: platform-root
        fieldPaths:
          - spec.source.path
        options:
          delimiter: /
          index: 1
