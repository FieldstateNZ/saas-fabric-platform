apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The bootstrap set: the project that bounds the platform, and the root
# Application that hands the cluster to Argo CD.
#
# Building this directory directly yields the LucentRoot defaults. To bootstrap
# a cluster, build the environment's binding instead, which pins the
# environment and revision from one place:
#
#   kubectl apply -k environments/<environment>/bootstrap
namespace: argocd

resources:
  - project.yaml
  - root-application.yaml
