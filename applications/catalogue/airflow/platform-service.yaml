# Platform service contract. See docs/platform-services.md.
service: airflow
deployment: assessed          # not adopted; see README.md
required: false
operatorUsage: true           # intended: provisioning and platform automation
clientPartitioning:
  mode: none
  provisioning: unsupported
clientCapability:
  available: false            # would implement capabilities, never be one
tenancy:
  status: rejected
  rationale: |
    A shared Airflow installation is not a client isolation boundary. Workers
    execute DAG code with the installation's own credentials, so a per-client
    partition inside one installation would be a convention, not a boundary.
blockers:
  - The chart bundles its own PostgreSQL, as Superset does.
  - DAG ownership is undecided -- which repository writes them, and how they
    reach the scheduler.
