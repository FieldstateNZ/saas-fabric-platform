apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# LucentRoot provisions the platform project and its dashboards, and no
# datasource. The collector's pipelines still terminate in the `debug` exporter,
# so there is nothing queryable to point a datasource at -- see
# applications/core/observability. Adding one is a file in this directory and a
# line below.
resources:
  - ../../base
