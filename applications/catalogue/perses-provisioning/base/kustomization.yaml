apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: catalogue

# Every generated ConfigMap carries the label Perses' provisioning sidecar
# watches for. The sidecar writes each data key into the provisioning folder as
# a file named by that key, which is why the keys keep their `.yaml` suffix --
# Perses only reads `.json`, `.yaml` and `.yml`.
#
# Name suffix hashes are disabled deliberately. A dashboard edit should show up
# in Argo CD as a changed ConfigMap, not as one resource created and another
# pruned; and the sidecar keys off the label, not the name.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    perses.dev/resource: "true"

# Datasources are absent on purpose. The endpoint is an environment fact and no
# environment has a queryable backend yet, so they are added by an overlay
# rather than here. See ../overlays/lucentroot.
configMapGenerator:
  # Separate from the dashboards, and not for tidiness. Perses refuses a
  # project-scoped resource whose project does not exist, so the Project is the
  # one thing here that everything else depends on.
  - name: perses-platform-project
    files:
      - project.yaml

  - name: perses-platform-dashboards
    files:
      - dashboards/telemetry-pipeline.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: perses
      fieldstate.nz/system: saas-fabric
      fieldstate.nz/layer: platform
