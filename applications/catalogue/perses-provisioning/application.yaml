apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: perses-provisioning
  namespace: argocd
  labels:
    fieldstate.nz/source: kustomize
    fieldstate.nz/class: catalogue
  annotations:
    # Same wave as Perses. Within a wave Argo CD applies everything before
    # waiting on health, and the provisioning sidecar picks a ConfigMap up
    # whenever it appears, so neither order matters.
    argocd.argoproj.io/sync-wave: "40"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # The catalogue project, not the platform one. `catalogue` is deliberately not
  # in the platform project's destinations, which is why this cannot live with
  # the other platform-owned configuration.
  project: saas-fabric-catalogue

  source:
    repoURL: https://github.com/FieldstateNZ/saas-fabric-platform.git
    targetRevision: PLACEHOLDER
    path: applications/catalogue/perses-provisioning/overlays/PLACEHOLDER

  destination:
    server: https://kubernetes.default.svc
    namespace: catalogue

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
