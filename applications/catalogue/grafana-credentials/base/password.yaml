# Grafana's admin credential, generated in-cluster. Same reasoning as
# applications/core/keycloak-credentials: an arbitrary password should never be
# chosen by a person or transported from one.
#
#   kubectl -n catalogue get secret grafana-admin \
#     -o jsonpath='{.data.password}' | base64 -d
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grafana-admin
  namespace: catalogue
spec:
  length: 32
  digits: 5
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# refreshInterval "0": Grafana writes the admin user into its own database at
# first start, so a later refresh would rotate this Secret while Grafana kept
# the original.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: catalogue
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "0"
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      data:
        username: admin
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: grafana-admin
