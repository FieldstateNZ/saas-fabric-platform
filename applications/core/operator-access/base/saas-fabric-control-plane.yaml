# Operator-plane access to the SaaS Fabric control plane.
#
# The Tailscale proxy is the only thing that reaches the operator listener, and
# this Ingress is what puts it there. It no longer names the two backing
# services: it points at the operator edge, and Envoy routes.
#
# # Why the routing moved to Envoy
#
# Because the identity provider has to be on the same origin. Operators sign in
# to Keycloak, and Keycloak builds its login form's action from the host the
# request arrived on — so the console, the API and the realm endpoints all have
# to answer on one hostname or the form posts somewhere the browser cannot
# reach. That is the same shape a client instance has: one front door, the
# identity provider behind it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-fabric-control-plane
  namespace: platform-system
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - fabric.invalid
  rules:
    - host: fabric.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform-operator-edge
                port:
                  number: 80
