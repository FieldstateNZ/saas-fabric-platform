# Operator-plane access to the SaaS Fabric control plane.
#
# This is the surface that replaces the vendor consoles the platform no longer
# publishes. Here rather than in the control plane's own Application for the
# reason given in argocd.yaml: an Ingress without a load-balancer address is
# Progressing, and rendering one from a service's own Application makes that
# service's health depend on the Tailscale operator.
#
# # The two backends are one origin on purpose
#
# The console calls the API on the same origin, so this Ingress is where `/api`
# and everything else are joined. The alternative — the console proxying `/api`
# itself — would mean the console's container holding the API's address, and the
# browser's same-origin guarantee resting on a proxy hop rather than on routing.
#
# Order matters: `/api` is listed first because the Tailscale operator programs
# these as an ordered match, and a `/` prefix first would swallow it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-fabric-control-plane
  namespace: platform-system
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - fabric.invalid
  rules:
    - host: fabric.invalid
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: saas-fabric-control-plane
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: saas-fabric-control-plane-ui
                port:
                  number: 80
