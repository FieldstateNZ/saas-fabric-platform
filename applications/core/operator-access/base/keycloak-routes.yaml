# Keycloak's authentication endpoints, on the operator hostname.
#
# In this file rather than beside the control plane's routes because the
# backend lives in `identity`, and a route reaching across namespaces would
# need a ReferenceGrant. Putting the route where the service is avoids that
# entirely — Gateway API allows a route to reference a service in its own
# namespace without ceremony.
#
# **`/admin` is absent, and its absence is the rule.** The upstream console is
# published on no plane in any environment; SaaS Fabric administers Keycloak
# through the Admin REST API, cluster-locally. `scripts/check.py` rejects a `/`
# or `/admin` match for this service.
#
# # Why this route restates the scheme
#
#   {"error":"invalid_request","error_description":"HTTPS required"}
#
# Keycloak's realms refuse plain HTTP from a client they consider external, and
# a tailnet address (100.64/10) is external. The operator *did* arrive over
# HTTPS — the operator ingress terminates it — but Envoy is an edge proxy here:
# with `use_remote_address` and zero trusted hops, it appends its downstream to
# `X-Forwarded-For` and overwrites `X-Forwarded-Proto` with the protocol of its
# own hop, which is plain. Measured on the running gateway: the proxy arrives
# from inside the pod network and Envoy still rewrote both headers.
#
# A route filter runs in the router, *after* the connection manager has done
# that — so with the connection manager's default behaviour, a route filter
# was the first point in the pipeline where the asserted value survived to be
# read.
#
# **The operator listener itself now asserts the scheme, for every route on
# it, not only this one.** `platform-gateway`'s
# `overlays/lucentroot/operator-scheme.yaml` configures client-IP detection
# for this listener, which — as a side effect of Envoy Gateway installing
# that extension — turns off the connection manager's own overwrite-to-http
# branch entirely, and pairs it with an early header assertion of `https`
# that is what actually survives into `:scheme`, since nothing downstream
# undoes it once that branch is off. See that file for the full mechanism —
# it is one fix in two parts, not two independent ones — and for why a route
# filter could not reach the actual failure this closes — Envoy's own OAuth2
# filter, reading `:scheme` before any route's filters run.
#
# This route's own filter stays for now regardless — belt and braces until a
# sign-in through the listener has actually been observed returning to an
# `https://` URL, not a change to bundle with introducing that policy.
# **Envoy sets this; it does not believe a caller.** Absent the listener
# policy, whatever `X-Forwarded-Proto` a client sends is replaced with `http`
# by the connection manager before this filter runs, and asserted again here
# regardless. The assertion is the gateway's statement about a listener that
# only serves the operator hostname behind a TLS-terminating ingress — not
# the request's claim about itself. Keycloak's `sslRequired: external` is
# untouched.
#
# `scripts/check.py` asserts no other route sets this, and now also permits
# exactly one listener-wide assertion of it: a `ClientTrafficPolicy` targeting
# the `platform` Gateway's `operator` listener. The same filter, or the same
# policy, anywhere else on the product plane would let a LAN client on plain
# HTTP be labelled `https`, which is the check this exists to preserve.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-operator
  namespace: identity
spec:
  parentRefs:
    - name: platform
      namespace: platform-system
      sectionName: operator
  hostnames:
    - fabric.invalid
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /realms
        - path:
            type: PathPrefix
            value: /resources
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: keycloak-http
          port: 80
