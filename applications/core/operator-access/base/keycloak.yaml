# Operator-plane access to Keycloak's administrative surface.
#
# This lives here rather than in Keycloak's own chart values on purpose. Argo CD
# treats an Ingress without a load-balancer address as Progressing, so an
# operator-plane Ingress rendered by a service's own chart makes that service's
# health depend on the Tailscale operator -- and a broken operator plane then
# gates every wave behind it. Keeping them here confines that coupling to one
# Application in a terminal wave.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-admin
  namespace: identity
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - auth-admin.invalid
  rules:
    - host: auth-admin.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-http
                port:
                  number: 80
