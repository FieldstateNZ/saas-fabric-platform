# Keycloak's authentication endpoints on the operator plane.
#
# # Why this is an Ingress and not a route through Envoy
#
# It was a route through Envoy, and it did not work. Keycloak's realms refuse
# plain HTTP from outside the cluster; the operator arrives over HTTPS, but
# Envoy rewrites `X-Forwarded-Proto` from the protocol of *its own* downstream
# connection, which is the plain hop from the Tailscale proxy. Keycloak was
# told `http` and answered:
#
#   {"error":"invalid_request","error_description":"HTTPS required"}
#
# Envoy is not lying -- it is describing the hop it can see, and it has no way
# to describe the one before it. Neither an early header mutation nor a
# client-supplied header survives, because the rewrite happens after both.
#
# The Tailscale proxy sets the header correctly on its own. Measured, not
# assumed: pointed straight at `keycloak-http`, the issuer comes back
# `https://…`. So Keycloak gets its own front door, exactly like Argo CD and
# OpenBao beside it, and Envoy is simply not in that path.
#
# # This is not same-origin, and does not need to be
#
# The console *navigates* to Keycloak; it never fetches it, because the
# control-plane API redeems the authorization code server-side. A content
# security policy restricts fetches, not navigation -- so an identity provider
# on its own origin is the ordinary OIDC arrangement rather than a compromise.
#
# # `/admin` is absent, and its absence is the rule
#
# Two paths, listed explicitly. A `/` prefix here would publish the admin
# console on the operator plane, which no plane publishes in any environment.
# `scripts/check.py` refuses an Ingress that reaches an administrative surface.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-operator
  namespace: identity
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - auth.invalid
  rules:
    - host: auth.invalid
      http:
        paths:
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: keycloak-http
                port:
                  number: 80
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: keycloak-http
                port:
                  number: 80
