# Operator-plane access to OpenBao's UI and API.
#
# Workloads reach OpenBao cluster-locally and need no ingress at all; this
# exists for the humans who administer it. Here rather than in OpenBao's chart
# values for the reason given in keycloak.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbao-admin
  namespace: secrets
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - bao.invalid
  rules:
    - host: bao.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openbao
                port:
                  number: 8200
