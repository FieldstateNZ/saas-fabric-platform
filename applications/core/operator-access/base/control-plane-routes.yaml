# What answers on the operator hostname.
#
# Order matters: Gateway API matches the most specific path, but these are
# written longest-first so a reader sees the same precedence the implementation
# applies. `/` is last because it catches everything else.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: saas-fabric-control-plane
  namespace: platform-system
spec:
  parentRefs:
    - name: platform
      namespace: platform-system
      sectionName: operator
  hostnames:
    - fabric.invalid
  rules:
    # The API the console calls, on its own origin.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: saas-fabric-control-plane
          port: 80

    # Everything else is the console's static bundle.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: saas-fabric-control-plane-ui
          port: 80
