apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - api-access.yaml

# Tailnet hostnames. The Tailscale operator registers each as
# <hostname>.<tailnet>, so these are short names rather than FQDNs.
patches:
  - target:
      kind: Ingress
      name: argocd
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: argocd-lucentroot
      - op: replace
        path: /spec/tls/0/hosts/0
        value: argocd-lucentroot
  - target:
      kind: Ingress
      name: openbao-admin
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: bao-lucentroot
      - op: replace
        path: /spec/tls/0/hosts/0
        value: bao-lucentroot
  - target:
      kind: Ingress
      name: saas-fabric-control-plane
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: fabric-lucentroot
      - op: replace
        path: /spec/tls/0/hosts/0
        value: fabric-lucentroot
