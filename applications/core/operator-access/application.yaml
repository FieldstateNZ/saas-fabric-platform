apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: operator-access
  namespace: argocd
  labels:
    fieldstate.nz/source: kustomize
    fieldstate.nz/class: core
    fieldstate.nz/plane: operator
  annotations:
    # Terminal wave, after everything. The operator plane must never be able to
    # gate the product plane: Argo CD treats an Ingress without a load-balancer
    # address as Progressing, so anything holding operator-plane Ingresses is
    # unhealthy for as long as the Tailscale operator is. Nothing depends on
    # this Application, so its being unhealthy costs administrative access and
    # nothing else.
    argocd.argoproj.io/sync-wave: "50"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: saas-fabric-platform

  source:
    repoURL: https://github.com/FieldstateNZ/saas-fabric-platform.git
    targetRevision: PLACEHOLDER
    path: applications/core/operator-access/overlays/PLACEHOLDER

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
