# The client secret `saas-fabric-gateway` authenticates with, generated
# in-cluster.
#
# Nobody chooses this value and nobody transports it. Before this Application,
# it was a person creating the confidential client in Keycloak by hand and
# writing its secret into OpenBao -- the same shape of hand-made step the
# platform already refuses for its own OpenBao seal and its own Keycloak
# administrator. ADR 0025 in the application repository applies that same rule
# here: the platform has a third authority already in the cluster -- the
# Keycloak bootstrap administrator it generated (../keycloak-credentials) --
# and composing the realm's edge with it is the same kind of act as composing
# any other piece of the platform.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: saas-fabric-gateway-oidc
  namespace: operator-system
spec:
  length: 32
  digits: 5
  # No symbols: this value is passed through Terraform, container env and
  # Envoy's own Secret read in more places than is comfortable. 32
  # alphanumeric characters is ample entropy for a confidential client secret.
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# refreshInterval "0" is load-bearing, not a default -- the same reasoning
# ../keycloak-credentials states for the Keycloak admin password, applied to a
# second value with the same shape.
#
# master-instance's convergence sets this exact value on the Keycloak client
# once, the same way it was set by hand before this Application existed. If
# this Secret refreshed later, the value here would rotate while the client
# in Keycloak kept the original -- a client secret that looks correct and does
# not authenticate. Rotating it is a convergence re-run against a regenerated
# value (delete this generator's state and let it run again), not a Kubernetes
# refresh.
#
# The `saas-fabric-control-plane-oidc` SecurityPolicy
# (../saas-fabric-control-plane/overlays/lucentroot/oidc.yaml) reads this same
# Secret by name -- one object, three readers: this generator writes it, the
# convergence Job in ../master-instance reads it to set the client, and Envoy
# reads it to redeem an authorization code.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: saas-fabric-gateway-oidc
  namespace: operator-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "0"
  target:
    name: saas-fabric-gateway-oidc
    creationPolicy: Owner
    template:
      data:
        client-secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: saas-fabric-gateway-oidc
