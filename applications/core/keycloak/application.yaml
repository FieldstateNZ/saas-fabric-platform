apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  labels:
    fieldstate.nz/source: helm
    fieldstate.nz/class: core
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: saas-fabric-platform

  sources:
    - repoURL: https://codecentric.github.io/helm-charts
      chart: keycloakx
      targetRevision: 7.3.0
      helm:
        releaseName: keycloak
        ignoreMissingValueFiles: true
        valueFiles:
          - $platform/applications/core/keycloak/values.yaml
          - $platform/environments/PLACEHOLDER/config/keycloak.yaml
    - repoURL: https://github.com/FieldstateNZ/saas-fabric-platform.git
      targetRevision: PLACEHOLDER
      ref: platform

  destination:
    server: https://kubernetes.default.svc
    namespace: identity

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        fieldstate.nz/system: saas-fabric
        fieldstate.nz/layer: platform
        # Permits this namespace to attach routes to the platform Gateway.
        fieldstate.nz/gateway-access: "true"

        # Keycloak answers on both planes now. Applications reach it on the
        # product edge; operators reach it on the operator listener, on the
        # same origin as the console they signed in from. Neither route
        # publishes /admin.
        fieldstate.nz/operator-gateway-access: "true"
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
