# Platform service contract. See docs/platform-services.md.
#
# The reference pattern for every shared service: one runtime, a platform
# administrative context, and one partition per client.
service: keycloak
deployment: adopted
required: true
operatorUsage: true     # the administration console, on the operator plane
controlPlane:
  # The first service to adopt the rule fully. SaaS Fabric administers Keycloak
  # through its Admin REST API, server-side and cluster-locally. The upstream
  # console is a vendor administration surface, not the capability itself, so it
  # is published on no plane -- and `adminBackends` is what check.py uses to
  # prove no Ingress quietly puts it back.
  #
  # Namespaced, because a Service is identified by (namespace, name). A bare
  # name would make the invariant depend on nobody reusing `keycloak-http` in
  # another namespace, which is a convention rather than a property of the
  # cluster. Same shape as exposure.backends, and the same reason.
  managed: true
  upstreamAdminSurface: not-exposed
  adminBackends:
    - name: keycloak-http
      namespace: identity
clientPartitioning:
  mode: strong
  unit: realm
  provisioning: supported
  owner: saas-fabric-clients
clientCapability:
  available: false      # every client has identity; it is not selectable
tenancy:
  status: accepted
  rationale: |
    A realm is Keycloak's own isolation boundary: separate users, clients,
    roles, tokens, signing keys and administrative delegation. Cross-realm
    access requires deliberate federation.
