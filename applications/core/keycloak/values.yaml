# Keycloak values shared by every environment.
# Environment differences live in environments/<env>/config/keycloak.yaml.
#
# No realm, client or user is defined here. Client realms are reconciled by the
# client layer; see README.md.

fullnameOverride: keycloak

replicas: 1

command:
  - /opt/keycloak/bin/kc.sh
  - start

# TLS terminates at the platform Gateway; Keycloak trusts the forwarded headers.
proxy:
  enabled: true
  mode: forwarded

http:
  relativePath: /
  managementRelativePath: /

database:
  vendor: postgres
  hostname: keycloak-db-rw.identity.svc.cluster.local
  port: 5432
  database: keycloak
  username: keycloak
  # Generated by CloudNativePG; see applications/core/keycloak-database.
  existingSecret: keycloak-db-app
  existingSecretKey: password

# Blocks startup until PostgreSQL accepts connections, so a slow database does
# not surface as a Keycloak crash loop.
dbchecker:
  enabled: true

# Injected externally at bootstrap. The secret is never created by this
# repository; see README.md.
extraEnv: |
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    valueFrom:
      secretKeyRef:
        name: keycloak-admin
        key: username
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-admin
        key: password

health:
  enabled: true

metrics:
  enabled: true

serviceAccount:
  create: true

resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    memory: 1500Mi
