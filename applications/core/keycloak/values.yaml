# Keycloak values shared by every environment.
# Environment differences live in environments/<env>/config/keycloak.yaml.
#
# No realm, client or user is defined here. Client realms are reconciled by the
# client layer; see README.md.

fullnameOverride: keycloak

replicas: 1

command:
  - /opt/keycloak/bin/kc.sh
  - start

# TLS terminates at the platform Gateway; Keycloak trusts the forwarded headers.
proxy:
  enabled: true
  mode: forwarded

http:
  relativePath: /
  managementRelativePath: /

database:
  vendor: postgres
  hostname: keycloak-db-rw.identity.svc.cluster.local
  port: 5432
  database: keycloak
  username: keycloak
  # Generated by CloudNativePG; see applications/core/keycloak-database.
  existingSecret: keycloak-db-app
  existingSecretKey: password

# Blocks startup until PostgreSQL accepts connections, so a slow database does
# not surface as a Keycloak crash loop.
dbchecker:
  enabled: true

# Public URLs Keycloak issues in tokens and redirects. Set per environment in
# environments/<env>/config/keycloak.yaml; the chart runs `tpl` over extraEnv,
# so they can vary without each environment restating the block below.
#
# hostname is not optional. Keycloak 26 refuses to start in production mode
# without it -- "hostname is not configured" -- and the value is what it puts in
# the OIDC issuer, so it must be the product-plane URL.
hostnames:
  public: https://auth.invalid
  admin: https://auth-admin.invalid

# The admin credential is generated in-cluster; see ../keycloak-credentials.
extraEnv: |
  - name: KC_HOSTNAME
    value: {{ .Values.hostnames.public }}
  # The two planes stated in Keycloak's own configuration: tokens and redirects
  # use the product hostname, the administration console answers on the
  # operator-plane one. Without this, reaching the console over the tailnet is a
  # hostname mismatch against the issuer.
  - name: KC_HOSTNAME_ADMIN
    value: {{ .Values.hostnames.admin }}
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    valueFrom:
      secretKeyRef:
        name: keycloak-admin
        key: username
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-admin
        key: password

health:
  enabled: true

metrics:
  enabled: true

serviceAccount:
  create: true

resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    memory: 1500Mi
