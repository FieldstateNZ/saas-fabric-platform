# Keycloak values shared by every environment.
# Environment differences live in environments/<env>/config/keycloak.yaml.
#
# No realm, client or user is defined here. Client realms are reconciled by the
# client layer; see README.md.

fullnameOverride: keycloak

replicas: 1

command:
  - /opt/keycloak/bin/kc.sh
  - start

# Keycloak sits behind a reverse proxy on both planes -- Envoy Gateway on the
# product plane, the Tailscale proxy on the operator plane -- and speaks plain
# HTTP to both. It needs the forwarded headers to determine the request origin;
# without them, origin checking on a proxied request answers 403.
#
# xforwarded, not forwarded. `forwarded` is RFC 7239, and measuring what Envoy
# Gateway actually sends on this cluster gives X-Forwarded-For and
# X-Forwarded-Proto with no `Forwarded` header at all. Set to `forwarded`,
# Keycloak looks for a header that never arrives -- configured-looking and
# wrong.
proxy:
  enabled: true
  mode: xforwarded

http:
  relativePath: /
  managementRelativePath: /

database:
  vendor: postgres
  hostname: keycloak-db-rw.identity.svc.cluster.local
  port: 5432
  database: keycloak
  username: keycloak
  # Generated by CloudNativePG; see applications/core/keycloak-database.
  existingSecret: keycloak-db-app
  existingSecretKey: password

# Blocks startup until PostgreSQL accepts connections, so a slow database does
# not surface as a Keycloak crash loop.
dbchecker:
  enabled: true

# Public URLs Keycloak issues in tokens and redirects. Set per environment in
# environments/<env>/config/keycloak.yaml; the chart runs `tpl` over extraEnv,
# so they can vary without each environment restating the block below.
#
# Keycloak 26 refuses to start in production mode without *either* a pinned
# hostname or `hostname-strict: false`. This platform chooses the second, and
# the choice is load-bearing rather than a relaxation.
#
# A pinned hostname is emitted in the login form's action, the issuer and every
# redirect, whatever host the request actually arrived on. One Keycloak behind
# several front doors -- a client instance's domain, the operator plane -- would
# then send every one of them to whichever door was pinned. Deriving it from
# the request is what lets each front door work.
#
# `strict: false` and no `public`. An environment may still pin one by setting
# `hostnames.public`, which is what a single-front-door deployment wants.
hostnames:
  strict: false

# The admin credential is generated in-cluster; see ../keycloak-credentials.
extraEnv: |
  {{- if .Values.hostnames.public }}
  - name: KC_HOSTNAME
    value: {{ .Values.hostnames.public }}
  {{- else }}
  # Derived from the request. `KC_PROXY_HEADERS: xforwarded` above is what
  # makes that safe: the host and scheme come from headers the proxy sets,
  # not from anything a client can assert for itself.
  - name: KC_HOSTNAME_STRICT
    value: "false"
  {{- end }}
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    valueFrom:
      secretKeyRef:
        name: keycloak-admin
        key: username
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-admin
        key: password

health:
  enabled: true

metrics:
  enabled: true

serviceAccount:
  create: true

resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    memory: 1500Mi
