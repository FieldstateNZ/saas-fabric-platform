# OpenBao values shared by every environment.
# Environment differences live in environments/<env>/config/openbao.yaml.

global:
  enabled: true

# The Kubernetes-secret injector is not enabled: platform components read from
# OpenBao directly, and enabling a mutating webhook cluster-wide is a privilege
# decision that should be taken deliberately rather than inherited from a chart
# default.
injector:
  enabled: false

# How this instance seals and whether it initialises itself. Both are supplied
# per environment, because they are the one part of OpenBao's lifecycle that
# genuinely differs: LucentRoot is disposable and initialises itself, production
# keeps durable state and an external seal authority.
#
# The chart runs `tpl` over the Raft config below, so environments contribute
# these two stanzas rather than restating the whole configuration.
#
# Empty by default. An environment that supplies neither gets a Shamir-sealed
# OpenBao that must be initialised and unsealed deliberately, which is the safe
# default for anything holding data worth keeping.
sealStanza: ""
initializeStanza: ""

server:
  # Raft in both environments so LucentRoot exercises the production storage
  # engine; only the replica count differs.
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      # Owned here rather than left to the chart default, because the seal and
      # initialize stanzas have to be composed into it.
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/openbao/data"
        }

        service_registration "kubernetes" {}

        {{ .Values.sealStanza }}

        {{ .Values.initializeStanza }}

  dataStorage:
    enabled: true
    size: 8Gi
    accessMode: ReadWriteOnce

  # Secret material must survive a StatefulSet being scaled down or deleted.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

  auditStorage:
    enabled: true
    size: 4Gi

  readinessProbe:
    enabled: true
    # Treat "not initialised" and "sealed" as Ready rather than as failure. Both
    # are expected states before the operator-driven initialise/unseal step in
    # the README, and a freshly reconciled platform should report Healthy.
    path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204

  # Deliberately off. A sealed pod is not fixed by restarting it, so a liveness
  # probe would turn "needs unsealing" into a crash loop. Readiness keeps a
  # sealed instance out of the Service; recovery is the unseal step.
  livenessProbe:
    enabled: false

  service:
    enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

ui:
  enabled: true
  serviceType: ClusterIP

csi:
  enabled: false
