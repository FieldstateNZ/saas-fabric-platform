# Platform hostname for SaaS Fabric. The host is set per environment.
#
# Client hostnames (acme.fieldstate.nz) are never defined here; they belong to
# client provisioning.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-fabric
spec:
  ingressClassName: nginx
  rules:
    - host: fabric.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: saas-fabric
                port:
                  name: http
