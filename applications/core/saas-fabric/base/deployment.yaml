# Deployment contract for SaaS Fabric.
#
# This repository owns how SaaS Fabric is deployed, never what it does. No
# application source code, and no client state, belongs here.
#
# replicas is 0, and the reason has changed. The image exists now — 0.1.0 is
# published and pinned below. What does not exist is anything for the runtime
# plane to serve: it resolves tenants against reconciled bindings, DataSources
# and a resource catalogue, and executes through an NDC connector process. None
# of those is on LucentRoot, and nothing yet writes them.
#
# So this stays at zero deliberately rather than for want of an image, and
# activating it is its own vertical slice: publish runtime bindings, stand up a
# connector, then set the replica count here. See README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-fabric
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: saas-fabric
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saas-fabric
    spec:
      serviceAccountName: saas-fabric
      securityContext:
        runAsNonRoot: true

        # 65532 is `nonroot` in the distroless base, stated numerically because
        # the kubelet cannot check a *name*. The image declares `USER nonroot`,
        # and with `runAsNonRoot: true` and no UID here the kubelet refuses to
        # start the container at all:
        #
        #   container has runAsNonRoot and image has non-numeric user
        #   (nonroot), cannot verify user is non-root
        #
        # It is not a warning and not a fallback -- the pod never runs. The
        # console beside this needs no such line because nginx-unprivileged
        # declares a numeric UID of its own, which is the whole difference.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: saas-fabric
          image: ghcr.io/fieldstatenz/saas-fabric:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # The application reads TOML from this path and refuses to start if
            # it is missing. `SAAS_FABRIC__*` environment variables, which this
            # Deployment previously supplied, are not a contract the
            # application has ever had — it namespaces its own settings
            # `FABRIC_SETTING_*` and takes everything else from the file.
            - name: FABRIC_CONFIG
              value: /etc/fabric/config.toml
            - name: RUST_LOG
              value: info
          envFrom:
            # Secret references resolve to `FABRIC_SECRET_*` variables. Optional
            # so the platform converges before any exist.
            - secretRef:
                name: saas-fabric-secrets
                optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/fabric
              readOnly: true

            # `fabric-runtime-tenants`, one of the runtime publisher's three
            # ConfigMaps (ADR 0023 §4 in the application repository). A
            # whole-volume mount, never `subPath` — a `subPath` mount is
            # resolved once at pod start and never updated, which would leave
            # this pod holding whatever tenant document existed when it
            # started while the ConfigMap moved on underneath it (ADR 0018).
            # Its own directory, because a ConfigMap volume owns the whole
            # directory it is mounted at and three ConfigMaps cannot share
            # one. Nothing in this repository declares this ConfigMap, so no
            # Argo sync can ever revert a publication by writing over it.
            - name: state-tenants
              mountPath: /etc/fabric/state/tenants
              readOnly: true

            # `fabric-runtime-data-sources`, the publisher's second document.
            # Same reasoning as tenants above: its own whole-volume directory.
            - name: state-data-sources
              mountPath: /etc/fabric/state/data-sources
              readOnly: true

            # `fabric-runtime-catalog`, the publisher's third document.
            - name: state-catalog
              mountPath: /etc/fabric/state/catalog
              readOnly: true
          livenessProbe:
            httpGet:
              # `/health` and `/ready`, which is what the application serves.
              # The previous `/healthz/live` and `/healthz/ready` were never
              # endpoints; at one replica they would have failed every probe.
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: saas-fabric-config

        # Not `optional: true`, on any of the three below. ADR 0023 §5 raises
        # this Deployment's replica count only once the controller reports a
        # complete publication, so by the time a real pod is asked to start,
        # every document should already exist -- and if one does not, that is
        # exactly the case this Deployment must not paper over. An optional
        # ConfigMap volume mounts as empty when absent, which would let a pod
        # start, serve nothing correctly, and fail closed at the first
        # request instead of at admission, which is the later and worse place
        # to discover a publication never finished. Absent the ConfigMap, the
        # kubelet holds the pod at `ContainerCreating` instead.
        - name: state-tenants
          configMap:
            name: fabric-runtime-tenants
        - name: state-data-sources
          configMap:
            name: fabric-runtime-data-sources
        - name: state-catalog
          configMap:
            name: fabric-runtime-catalog
