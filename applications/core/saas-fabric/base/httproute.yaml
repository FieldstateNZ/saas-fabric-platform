# Platform route for SaaS Fabric, attached to the shared platform Gateway.
#
# This is the runtime route ADR 0019 §G1 names in the application repository,
# and it is the only way into the runtime's Data API, `/v1/data/*`. The
# platform owns that edge, G1-G17. None of it is implemented yet: no JWT
# policy is attached to this route.
#
# Client routes (acme.<domain>) are never defined here; they are created by
# OpenTofu in the client's own namespace and attach to the same Gateway. A
# client instance's routes (its shell, modules and gateway sign-in session)
# never reach `/v1/data`. One that did would be a second edge, with nothing
# keeping its policy in step with G1's, even if it carried a JWT policy of
# its own. See ADR 0019 as amended under D01-5 (saas-fabric #108).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: saas-fabric
spec:
  parentRefs:
    - name: platform
      namespace: platform-system
      sectionName: http
  hostnames:
    - fabric.invalid
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: saas-fabric
          port: 80
