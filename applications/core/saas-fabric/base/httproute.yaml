# Platform routes for SaaS Fabric, attached to the shared platform Gateway.
#
# Two routes on purpose. A SecurityPolicy attaches to a whole HTTPRoute, and
# ADR 0019 keeps `/health` and `/ready` unauthenticated while every path that
# forwards to the Data API carries the JWT policy. One PathPrefix `/` cannot
# do both: a policy on it would challenge the probes.
#
# `saas-fabric` is path prefix `/v1/data` and carries
# `fieldstate.nz/data-api: tenant`. The SecurityPolicy selects that label, so
# a later route that also forwards to this Service on a non-probe path is
# covered by the same policy without a second copy of the provider list. One
# policy, many tenants. There is no per-tenant route.
#
# `saas-fabric-probes` is Exact `/health` and Exact `/ready`, with no such
# label. The deployment's probes hit the pod directly; these routes are what
# keeps the same paths open if a caller arrives through the gateway.
#
# Client routes are never defined here, and none of them may forward to
# `/v1/data`. See ADR 0019 as amended under D01-5 (saas-fabric #108).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: saas-fabric
  labels:
    fieldstate.nz/data-api: tenant
spec:
  parentRefs:
    - name: platform
      namespace: platform-system
      sectionName: http
  hostnames:
    - fabric.invalid
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/data
      backendRefs:
        - name: saas-fabric
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: saas-fabric-probes
spec:
  parentRefs:
    - name: platform
      namespace: platform-system
      sectionName: http
  hostnames:
    - fabric.invalid
  rules:
    - matches:
        - path:
            type: Exact
            value: /health
        - path:
            type: Exact
            value: /ready
      backendRefs:
        - name: saas-fabric
          port: 80
