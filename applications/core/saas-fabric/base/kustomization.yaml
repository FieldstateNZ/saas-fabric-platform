apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-system

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: saas-fabric
      app.kubernetes.io/part-of: saas-fabric
      fieldstate.nz/system: saas-fabric
      fieldstate.nz/layer: platform
