apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - https-redirect.yaml

# Pinned to the same tag LucentRoot runs. What holds this at zero is the base's
# replica count, and the reason is no longer the image — see ../../README.md.
images:
  - name: ghcr.io/fieldstatenz/saas-fabric
    newTag: 0.1.0

patches:
  # Both runtime routes keep sectionName `fabric` from the base. Only the
  # hostname is production's. The redirect route is not in this target: it
  # stays on `fabric-http`.
  - target:
      kind: HTTPRoute
      name: saas-fabric
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: fabric.fieldstate.nz
  - target:
      kind: HTTPRoute
      name: saas-fabric-probes
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: fabric.fieldstate.nz
