apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Pin a published tag here to go live. See ../../README.md.
images:
  - name: ghcr.io/fieldstatenz/saas-fabric
    newTag: placeholder

configMapGenerator:
  - name: saas-fabric-config
    behavior: merge
    literals:
      - SAAS_FABRIC__ENVIRONMENT=production
      - SAAS_FABRIC__PLATFORM_DOMAIN=platform.fieldstate.nz

generatorOptions:
  disableNameSuffixHash: true

patches:
  # TLS terminates at the Gateway's https listener, so the route selects that
  # listener rather than carrying a certificate of its own.
  - target:
      kind: HTTPRoute
      name: saas-fabric
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: fabric.fieldstate.nz
      - op: replace
        path: /spec/parentRefs/0/sectionName
        value: https
