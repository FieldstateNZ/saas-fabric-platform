apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Pinned to the same tag LucentRoot runs. What holds this at zero is the base's
# replica count, and the reason is no longer the image — see ../../README.md.
images:
  - name: ghcr.io/fieldstatenz/saas-fabric
    newTag: 0.1.0

patches:
  # TLS terminates at the Gateway's https listener, so the route selects that
  # listener rather than carrying a certificate of its own.
  - target:
      kind: HTTPRoute
      name: saas-fabric
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: fabric.fieldstate.nz
      - op: replace
        path: /spec/parentRefs/0/sectionName
        value: https
