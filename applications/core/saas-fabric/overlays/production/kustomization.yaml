apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Pin a published tag here to go live. See ../../README.md.
images:
  - name: ghcr.io/fieldstatenz/saas-fabric
    newTag: placeholder

configMapGenerator:
  - name: saas-fabric-config
    behavior: merge
    literals:
      - SAAS_FABRIC__ENVIRONMENT=production
      - SAAS_FABRIC__PLATFORM_DOMAIN=platform.fieldstate.nz

generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      kind: Ingress
      name: saas-fabric
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: fabric.fieldstate.nz
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - fabric.fieldstate.nz
            # Injected externally; see ../../README.md.
            secretName: fabric-tls
