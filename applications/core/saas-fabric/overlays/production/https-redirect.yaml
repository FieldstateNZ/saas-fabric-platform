# Port 80 for the fabric hostname. The listener is more specific than the
# hostname-less product listener, and this route is the only thing on it:
# every request is sent to HTTPS. There is no backend, so the bearer is not
# forwarded.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: saas-fabric-https-redirect
  namespace: platform-system
spec:
  parentRefs:
    - name: platform
      namespace: platform-system
      sectionName: fabric-http
  hostnames:
    - fabric.fieldstate.nz
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
