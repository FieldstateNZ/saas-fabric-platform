apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Pinned. The replica count in the base is what still holds this at zero, and
# for a reason that is no longer about the image — see ../../README.md.
images:
  - name: ghcr.io/fieldstatenz/saas-fabric
    newTag: 0.3.0-preview.1
    digest: sha256:086dbfdaf19458951d2bed618111f0ca47731c2bc8c2a45aa56b9b57a724977e

patches:
  - target:
      kind: HTTPRoute
      name: saas-fabric
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: fabric.lucentroot.internal
