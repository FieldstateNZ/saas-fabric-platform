apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Pinned. The replica count in the base is what still holds this at zero, and
# for a reason that is no longer about the image — see ../../README.md.
images:
  - name: ghcr.io/fieldstatenz/saas-fabric
    newTag: 0.3.0-preview.8
    digest: sha256:95ccb1953a88402cd93ed3d61d68ea914c6a14972eec00678e808ddaa214c5c9

patches:
  - target:
      kind: HTTPRoute
      name: saas-fabric
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: fabric.lucentroot.internal
