apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Pinned. The replica count in the base is what still holds this at zero, and
# for a reason that is no longer about the image — see ../../README.md.
images:
  - name: ghcr.io/fieldstatenz/saas-fabric
    newTag: 0.3.0-preview.12
    digest: sha256:a58dbb10dd048c0d68d2a88914ed493ed9476c95de30ce937cf6192095250062

patches:
  - target:
      kind: HTTPRoute
      name: saas-fabric
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: fabric.lucentroot.internal
