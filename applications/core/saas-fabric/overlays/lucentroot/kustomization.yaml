apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Pinned. The replica count in the base is what still holds this at zero, and
# for a reason that is no longer about the image — see ../../README.md.
images:
  - name: ghcr.io/fieldstatenz/saas-fabric
    newTag: 0.3.0-preview.9
    digest: sha256:aa49d9be3f7a7675eb8750fe4384cddca4d37e38b94476eea2f9e4a08431e5c7

patches:
  - target:
      kind: HTTPRoute
      name: saas-fabric
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: fabric.lucentroot.internal
