apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Pinned. The replica count in the base is what still holds this at zero, and
# for a reason that is no longer about the image — see ../../README.md.
images:
  - name: ghcr.io/fieldstatenz/saas-fabric
    newTag: 0.3.0-preview.2
    digest: sha256:437a9ff8181ceee70de15b0e363b2440cc14acca11f7a42027d3cf84730d2aac

patches:
  - target:
      kind: HTTPRoute
      name: saas-fabric
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: fabric.lucentroot.internal
