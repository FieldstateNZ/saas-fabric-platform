# Platform service contract. See docs/platform-services.md.
service: saas-fabric
deployment: adopted
required: true          # it is the product this platform exists to run
operatorUsage: false
clientPartitioning:
  mode: none            # SaaS Fabric manages clients; clients are not inside it
  provisioning: unsupported
clientCapability:
  available: false
tenancy:
  status: rejected
  rationale: |
    Not a shared service clients partition into. It is the thing that owns the
    definition of a client, and it reconciles the partitions in the services
    below it.
