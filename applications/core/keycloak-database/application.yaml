apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-database
  namespace: argocd
  labels:
    fieldstate.nz/source: kustomize
    fieldstate.nz/class: core
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: saas-fabric-platform

  source:
    repoURL: https://github.com/FieldstateNZ/saas-fabric-platform.git
    targetRevision: PLACEHOLDER
    path: applications/core/keycloak-database/overlays/PLACEHOLDER

  destination:
    server: https://kubernetes.default.svc
    namespace: identity

  syncPolicy:
    automated:
      # The Cluster carries Prune=false and Delete=false; see base/cluster.yaml.
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        fieldstate.nz/system: saas-fabric
        fieldstate.nz/layer: platform
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 10m
