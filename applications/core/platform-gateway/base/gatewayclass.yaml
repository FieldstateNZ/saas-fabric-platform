# The platform's product routing authority.
#
# Every product and client route attaches to a Gateway of this class. There is
# deliberately no second product-facing ingress controller: that would mean two
# places a hostname can be claimed. Administrative access is a separate plane
# (Tailscale) and never carries client traffic; see
# docs/architecture.md#exposure-planes.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: saas-fabric
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
