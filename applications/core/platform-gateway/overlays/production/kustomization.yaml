apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Listeners merge by name (see openapi.json). The patch adds `https` and
# `fabric-http` and moves `fabric` onto 443 without indexing the list.
resources:
  - ../../base
  - fabric-certificate.yaml

openapi:
  path: openapi.json

patches:
  - path: listeners.yaml
