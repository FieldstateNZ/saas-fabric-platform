apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # Production terminates TLS at the Gateway. The shared `https` listener is
  # every product hostname except the fabric host. The fabric listener
  # (listeners[2]: http, operator, fabric) becomes HTTPS for that host and
  # uses the same certificate reference. The secret is injected externally.
  - target:
      kind: Gateway
      name: platform
    patch: |-
      - op: replace
        path: /spec/listeners/2/protocol
        value: HTTPS
      - op: replace
        path: /spec/listeners/2/port
        value: 443
      - op: replace
        path: /spec/listeners/2/hostname
        value: fabric.fieldstate.nz
      - op: add
        path: /spec/listeners/2/tls
        value:
          mode: Terminate
          certificateRefs:
            - kind: Secret
              name: platform-tls
      - op: add
        path: /spec/listeners/-
        value:
          name: https
          protocol: HTTPS
          port: 443
          tls:
            mode: Terminate
            certificateRefs:
              # Injected externally; see ../../README.md.
              - kind: Secret
                name: platform-tls
          allowedRoutes:
            namespaces:
              from: Selector
              selector:
                matchLabels:
                  fieldstate.nz/gateway-access: "true"
