apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# LucentRoot terminates plain HTTP only. There is no certificate authority
# for *.lucentroot.internal. The fabric listener stays HTTP; only its
# hostname differs from the base placeholder. The openapi file makes
# listeners merge by name, so this patch does not depend on list position.
resources:
  - ../../base
  - operator-scheme.yaml

openapi:
  path: openapi.json

patches:
  - path: fabric-hostname.yaml
