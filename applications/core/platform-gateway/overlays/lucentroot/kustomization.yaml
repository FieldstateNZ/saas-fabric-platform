apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# LucentRoot terminates plain HTTP only. There is no certificate authority
# for *.lucentroot.internal. The fabric listener stays HTTP; only its
# hostname differs from the base placeholder. listeners[2] is `fabric`
# (http, operator, fabric).
resources:
  - ../../base
  - operator-scheme.yaml

patches:
  - target:
      kind: Gateway
      name: platform
    patch: |-
      - op: replace
        path: /spec/listeners/2/hostname
        value: fabric.lucentroot.internal
