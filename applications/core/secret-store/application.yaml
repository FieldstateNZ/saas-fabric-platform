apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-store
  namespace: argocd
  labels:
    fieldstate.nz/source: kustomize
    fieldstate.nz/class: core
  annotations:
    # After both halves it joins: External Secrets and OpenBao at wave 10.
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: saas-fabric-platform

  source:
    repoURL: https://github.com/FieldstateNZ/saas-fabric-platform.git
    targetRevision: PLACEHOLDER
    path: applications/core/secret-store/overlays/PLACEHOLDER

  destination:
    server: https://kubernetes.default.svc
    namespace: secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      # The store cannot become Healthy until OpenBao has its Kubernetes auth
      # method enabled, which is a one-time operator step. Retry patiently
      # rather than failing the platform.
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 10m
