# The platform's connection between External Secrets and OpenBao.
#
# Deliberately NOT a general-purpose store. Two bounds keep it inside the
# platform tenancy boundary rather than punching through it:
#
#   1. conditions   only namespaces labelled as platform-owned may reference it
#   2. the OpenBao policy behind it grants read on secret/platform/* only
#
# Without the first, anyone able to create an ExternalSecret in any namespace --
# including a future client namespace -- could ask External Secrets to fetch
# anything the operator's token can read. Without the second, that would be
# every secret in the mount.
#
# Client secret delivery is a separate mechanism: a SecretStore in the client's
# own namespace, bound to a client-scoped OpenBao role over secret/clients/...,
# created by client provisioning. It never reuses this store. See README.md.
#
# SkipDryRunOnMissingResource lets the first sync through before the External
# Secrets CRDs exist, which on a fresh cluster is the same reconciliation.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Platform namespaces only. The label is applied by each Application's
  # managedNamespaceMetadata and is deliberately never applied to client-owned
  # resources, so a client-* namespace cannot match.
  conditions:
    - namespaceSelector:
        matchLabels:
          fieldstate.nz/layer: platform

  provider:
    vault:
      # In-cluster and plaintext deliberately. The operator plane exists for
      # humans reaching OpenBao; this traffic never leaves the cluster network.
      server: http://openbao.secrets.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        # The operator mints its own service account token and exchanges it for
        # an OpenBao token. No static credential exists to leak or rotate.
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: secrets
