# The OpenTofu state Secret, annotated so Application deletion cannot drop it.
#
# The kubernetes backend creates this object (`secret_suffix = master-instance`
# in base/module/main.tf). Its body is state, written by the Job, and is not
# in Git. This manifest carries no `data`. kubectl's three-way merge leaves
# keys that were never in last-applied-configuration in place, and the
# Application's ignoreDifferences on `/data` keeps a later sync from treating
# the body as drift.
#
# `Delete=false` is O5. `Prune=false` matches the namespace: dropping this
# manifest must not delete the Secret. Deleting the namespace would delete it
# anyway, which is why the namespace carries both annotations too.
apiVersion: v1
kind: Secret
metadata:
  name: tfstate-default-master-instance
  namespace: master-instance-state
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
