# The convergence Job's identity. It mounts its own token, unlike the
# control plane's console account -- this identity exists for one thing: the
# `kubernetes` backend's own in-cluster authentication (module/main.tf's
# `in_cluster_config = true`) against the state Role and RoleBinding in
# ../overlays/lucentroot/state-rbac.yaml, which live in master-instance-state,
# not this namespace -- see that file and
# ../overlays/lucentroot/state-namespace.yaml for why state gets a namespace
# of its own. This identity does not read identity/keycloak-admin; that value
# arrives as an ordinary mirrored Secret from a *different* ServiceAccount
# entirely (../overlays/lucentroot/keycloak-admin-mirror.yaml), which External
# Secrets impersonates rather than one this Job's own Pod ever holds a token
# for.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: master-instance
automountServiceAccountToken: true
