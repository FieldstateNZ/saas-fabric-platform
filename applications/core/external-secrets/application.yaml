apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  labels:
    fieldstate.nz/source: helm
    fieldstate.nz/class: core
  annotations:
    # Wave 0, with the other operators. It has no dependencies of its own, and
    # OpenBao's seal key is generated by it -- so it has to be running before
    # OpenBao starts, not alongside it.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: saas-fabric-platform

  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.9.0
      helm:
        releaseName: external-secrets
        ignoreMissingValueFiles: true
        valueFiles:
          - $platform/applications/core/external-secrets/values.yaml
          - $platform/environments/PLACEHOLDER/config/external-secrets.yaml
    - repoURL: https://github.com/FieldstateNZ/saas-fabric-platform.git
      targetRevision: PLACEHOLDER
      ref: platform

  destination:
    server: https://kubernetes.default.svc
    namespace: secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        fieldstate.nz/system: saas-fabric
        fieldstate.nz/layer: platform
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
