apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Core platform: the applications SaaS Fabric itself requires in order to
# operate, in every environment. Listed in sync-wave order for readability; the
# ordering that matters is the argocd.argoproj.io/sync-wave annotation on each
# Application, which only sequences anything because of argocd/runtime.
#
# Adding to this list is a claim that SaaS Fabric cannot run without the
# component. See docs/adding-an-application.md.
#
# Two things are core but listed by each environment rather than here, because
# whether an environment runs them is a real decision:
#
#   ../core/tailscale, ../core/operator-access   the operator plane
#   ../core/openbao-seal                         a disposable OpenBao seal
resources:
  # wave 0 — operators, CRDs, and the seal key OpenBao starts with
  - envoy-gateway/application.yaml
  - cloudnative-pg/application.yaml
  - external-secrets/application.yaml
  # wave 10 — routing, data, secrets and telemetry foundations
  - platform-gateway/application.yaml
  - observability/application.yaml
  - openbao/application.yaml
  - keycloak-credentials/application.yaml
  - keycloak-database/application.yaml
  # wave 20 — identity and secret delivery
  - keycloak/application.yaml
  - secret-store/application.yaml
  # wave 30 — SaaS Fabric
  - saas-fabric/application.yaml
  # wave 40 — the control plane, after everything it administers
  - saas-fabric-control-plane/application.yaml
