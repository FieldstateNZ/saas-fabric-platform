apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  labels:
    fieldstate.nz/source: helm
    fieldstate.nz/class: core
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: saas-fabric-platform

  sources:
    # Envoy Gateway publishes only to OCI. With an oci:// scheme Argo CD treats
    # repoURL as the complete chart reference and does not append `chart` to the
    # registry path, so the chart name belongs in both: repoURL is what is
    # fetched, `chart` is what Helm is told it is rendering. Dropping it from
    # repoURL produces a 401 from the registry for a repository that does not
    # exist. Requires Argo CD 2.13 or later; see
    # docs/architecture.md#argo-cd-runtime-contract.
    - repoURL: oci://docker.io/envoyproxy/gateway-helm
      chart: gateway-helm
      targetRevision: 1.9.0
      helm:
        releaseName: envoy-gateway
        ignoreMissingValueFiles: true
        valueFiles:
          - $platform/applications/core/envoy-gateway/values.yaml
          - $platform/environments/PLACEHOLDER/config/envoy-gateway.yaml
    - repoURL: https://github.com/FieldstateNZ/saas-fabric-platform.git
      targetRevision: PLACEHOLDER
      ref: platform

  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The chart ships the Gateway API CRDs, which exceed the annotation size
      # limit used by client-side apply.
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        fieldstate.nz/system: saas-fabric
        fieldstate.nz/layer: platform
        # Permits this namespace to attach routes to the platform Gateway.
        fieldstate.nz/gateway-access: "true"
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
