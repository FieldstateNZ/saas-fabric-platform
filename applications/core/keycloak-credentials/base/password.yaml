# Keycloak's bootstrap administrator credential, generated in-cluster.
#
# Nobody chooses this password and nobody transports it. A credential a human
# picks is worse than one a machine generates, and a credential that has to
# travel is a credential that can leak on the way.
#
# Read it when you need it:
#   kubectl -n identity get secret keycloak-admin \
#     -o jsonpath='{.data.password}' | base64 -d
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: keycloak-admin
  namespace: identity
spec:
  length: 32
  digits: 5
  # No symbols: this value is passed through container env and shell quoting in
  # more places than is comfortable. 32 alphanumeric characters is ample.
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# refreshInterval "0" is load-bearing, not a default.
#
# Keycloak reads KC_BOOTSTRAP_ADMIN_* only on first start and writes the account
# into its own database. Regenerating this Secret later would rotate the value
# here while Keycloak kept the original, leaving a credential that looks correct
# and does not work.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: identity
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "0"
  target:
    name: keycloak-admin
    creationPolicy: Owner
    template:
      data:
        username: admin
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: keycloak-admin
