apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-credentials
  namespace: argocd
  labels:
    fieldstate.nz/source: kustomize
    fieldstate.nz/class: core
  annotations:
    # Wave 10, with External Secrets, so the credential exists before Keycloak
    # starts at wave 20. The generator needs no OpenBao, so nothing here waits
    # on OpenBao being initialised.
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: saas-fabric-platform

  source:
    repoURL: https://github.com/FieldstateNZ/saas-fabric-platform.git
    targetRevision: PLACEHOLDER
    path: applications/core/keycloak-credentials/overlays/PLACEHOLDER

  destination:
    server: https://kubernetes.default.svc
    namespace: identity

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The External Secrets CRDs arrive in this same wave.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 10m
