apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Pinned, never `latest`. Promote by editing this and nothing else.
images:
  - name: ghcr.io/fieldstatenz/saas-fabric-control-plane
    newTag: 0.1.0
  - name: ghcr.io/fieldstatenz/saas-fabric-control-plane-ui
    newTag: 0.1.0

# The environment's operator identity and its GitHub App installation.
configMapGenerator:
  - name: saas-fabric-control-plane-config
    behavior: replace
    files:
      - control-plane.toml
