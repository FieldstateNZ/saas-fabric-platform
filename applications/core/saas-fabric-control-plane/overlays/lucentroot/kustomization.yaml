apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Pinned, never `latest`. Promote by editing this and nothing else.
images:
  - name: ghcr.io/fieldstatenz/saas-fabric-control-plane
    newTag: 0.3.0-preview.9
    digest: sha256:8d3a55d3c347169434ff127878254c2e3e5094dd2a4250642b5a61e1f958b97d
  - name: ghcr.io/fieldstatenz/saas-fabric-control-plane-ui
    newTag: 0.3.0-preview.9
    digest: sha256:6435be7a01acc421c113e36581e7225bdcf5b3b80d65830e3a263801b879a26e

# The environment's identity provider, its own addresses, and where an
# operator's browser reaches this control plane. No GitHub App identifiers:
# the platform creates its own when an operator connects it.
configMapGenerator:
  - name: saas-fabric-control-plane-config
    behavior: replace
    files:
      - control-plane.toml

# The route matches on the Host the browser sends, which is the FQDN the
# Tailscale operator registers for this environment -- not the short name the
# Ingress beside it carries.
patches:
  - target:
      kind: HTTPRoute
      name: saas-fabric-control-plane
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: fabric-lucentroot.tail5a7546.ts.net
