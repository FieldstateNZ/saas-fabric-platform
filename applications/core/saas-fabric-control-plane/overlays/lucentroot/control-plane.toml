# LucentRoot's control-plane configuration.
#
# **Nothing here is a credential, and nothing here names a Git host.** The
# platform creates its own GitHub application when an operator connects it, and
# what it learns doing so — an application id, an installation, a private key —
# is state the platform owns rather than configuration a human writes down.
# That is the whole point of ADR 0011 in the application repository.
#
# **This deployment supplies no credential of any kind.** Keycloak is reached
# with the authority of the operator who asked — permission to create a realm
# belongs to a person in the master realm, not to a service account (ADR 0012).
listen = "0.0.0.0:8081"
request_timeout_seconds = 30

[control_plane]
# Where an operator's browser reaches this control plane. GitHub returns the
# browser here after each approval in the connection flow, so it must be the
# operator-plane hostname and it must be stated rather than taken from a
# request — a redirect target read from a `Host` header is one the caller chose.
public_base_url = "https://fabric-lucentroot.tail5a7546.ts.net"

[control_plane.operator]
mode = "oidc"

# What appears in a token, and where the browser is sent.
#
# The operator plane's own hostname, because Keycloak answers on it: the
# console, the API and the realm endpoints are all one origin behind one
# Tailscale front door, and Keycloak derives its issuer from the host the
# request arrived on. An operator never leaves this origin to sign in.
issuer = "https://fabric-lucentroot.tail5a7546.ts.net/realms/master"

# Where *this pod* reaches the same realm, which is not the same address: the
# tailnet hostname resolves for an operator's browser and for nothing inside
# the cluster. The signing keys and the code redemption go to the service.
#
# Collapsing these two is the failure that reads as something else — every
# operator refused, and a log saying either that no key set arrived or that the
# token is not from this realm.
reachable_at = "http://keycloak-http.identity.svc.cluster.local/realms/master"

client_id = "saas-fabric-console"

# Being on the tailnet establishes who someone is. This establishes that they
# administer this platform, and it is checked against a verified token rather
# than against a header a proxy set.
required_role = "fabric-operator"

# The console's origin root, not a path beneath it: the console is served with
# no history fallback, so a redirect to /callback would answer 404.
redirect_uri = "https://fabric-lucentroot.tail5a7546.ts.net/"

[control_plane.reconciliation]
interval_seconds = 60

[desired_state]
# Established in the product, not here. The control plane starts knowing only
# that it has no client configuration repository, reports itself unconfigured,
# and stays available so that an operator can connect one through the console.
mode = "managed"

[secret_store]
# Where this Fabric instance keeps what it must not lose — the private key of
# the application it creates, and the record describing it.
#
# The pod authenticates with its own Kubernetes identity, so there is no static
# credential for anybody to create, transport or rotate. The role and its
# policy are a one-time OpenBao step; see this directory's README.
mode = "open_bao"
address = "http://openbao.secrets.svc.cluster.local:8200"
role = "saas-fabric-control-plane"

[platform_management]
# This deployment manages LucentRoot, and knows nothing else about the platform
# repository. **Which** repository, and the credential for it, are operator
# state: an operator installs the Platform Management GitHub App and picks a
# repository through the console, exactly as they do for client configuration.
#
# There is no environment name in the binary and none in a request. A caller
# who could name an environment could name a path, because the name reaches the
# platform repository as one -- `environments/<name>/components.yaml`. So the
# deployment states the one environment it is, and the route takes nothing.
environment = "lucentroot"

# Sixty seconds because LucentRoot is an integration environment: a preview
# published now should be running within a minute, and being wrong about that
# costs a registry request nobody needed. Somewhere slower states something
# slower here; zero observes an environment without advancing it.
reconciliation_interval_seconds = 60

# `[platform_management.registry]` is omitted. It defaults to ghcr.io, which is
# where SaaS Fabric publishes, and **it carries no credential** -- anonymous OCI
# distribution serves tag listings, manifests and config blobs. The Platform
# Management application's authority is over the platform repository and is
# never the registry credential; a boundary that does not exist cannot be
# conflated with one that does.

[identity_provider]
mode = "keycloak"
# Cluster-local. Keycloak's administrative API is not published on any plane,
# and this is the path that replaces having published it.
base_url = "http://keycloak-http.identity.svc.cluster.local"
admin_realm = "master"
client_id = "saas-fabric"

# No credential. The platform presents the operator's own bearer, so there is
# nothing here for a deployment to deliver and nothing to rotate.
http_timeout_seconds = 10
