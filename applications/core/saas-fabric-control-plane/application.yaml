apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saas-fabric-control-plane
  namespace: argocd
  labels:
    fieldstate.nz/source: kustomize
    fieldstate.nz/class: core
  annotations:
    # After SaaS Fabric's runtime plane at 30, and after everything it
    # administers. It reconciles Keycloak, so Keycloak has to exist first; it
    # reads secrets, so secret delivery has to exist first.
    argocd.argoproj.io/sync-wave: "40"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: saas-fabric-platform

  source:
    repoURL: https://github.com/FieldstateNZ/saas-fabric-platform.git
    targetRevision: PLACEHOLDER
    path: applications/core/saas-fabric-control-plane/overlays/PLACEHOLDER

  destination:
    server: https://kubernetes.default.svc
    namespace: operator-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        fieldstate.nz/system: saas-fabric
        fieldstate.nz/layer: platform
        fieldstate.nz/plane: operator

        # **Only** the operator grant, and a namespace of its own so that the
        # word "only" means something.
        #
        # This used to live in `platform-system` with the label merely omitted
        # here. That was not the guarantee it read as: the namespace carries
        # `gateway-access` from its other tenants, so a route in it was
        # eligible for the product listener no matter what this Application
        # left out. Naming `sectionName: operator` on the route was then a
        # choice the route made about itself, which is convention, not a
        # boundary.
        #
        # A namespace that carries one label and not the other is a boundary
        # Kubernetes enforces: a route here that named the product listener is
        # refused by the Gateway's own selector, not by review.
        fieldstate.nz/operator-gateway-access: "true"
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
