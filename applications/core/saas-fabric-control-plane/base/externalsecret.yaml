# The one credential the control plane is *given*.
#
# It used to be two. The GitHub App's private key is no longer delivered here
# because it is no longer delivered at all: the platform creates its own
# application when an operator connects it, and writes the key straight into
# its own secret partition — a path External Secrets cannot provide, because
# projecting secrets into a pod is one-way.
#
# What remains is Keycloak's service-account credential, which reconciliation
# authenticates with. It is *issued elsewhere and consumed here*, which is what
# makes this the right delivery path for it — unlike Keycloak's bootstrap admin
# password, which is generated in-cluster precisely because nobody needs to
# choose or transport it.
#
# The key shape follows the `openbao` ClusterSecretStore: its provider is
# mounted at `secret` with KV v2, so a reference is `platform/...` and not
# `secret/platform/...`. Writing the mount into the reference is the mistake
# that produces a confusing "path not found" against a path that plainly exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: saas-fabric-control-plane-secrets
spec:
  # An hour: these change when someone rotates them, which is rare, and a
  # shorter interval would poll OpenBao for nothing.
  refreshInterval: 1h

  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore

  target:
    name: saas-fabric-control-plane-secrets
    creationPolicy: Owner

  # Named rather than extracted, because the application's contract is an
  # environment variable name derived from a reference in its configuration —
  # `keycloak/saas-fabric` becomes `FABRIC_SECRET_KEYCLOAK_SAAS_FABRIC`. Mapping
  # explicitly keeps OpenBao's key names natural and the application's contract
  # visible in one place.
  data:
    - secretKey: FABRIC_SECRET_KEYCLOAK_SAAS_FABRIC
      remoteRef:
        key: platform/saas-fabric/keycloak
        property: client-secret
