# What answers on the operator hostname.
#
# In this directory rather than beside the Tailscale Ingress, and that is the
# point: this route can only attach to the operator listener because the
# namespace it lives in carries only `operator-gateway-access`. It is not
# choosing to be operator-only by naming a `sectionName` -- a route that named
# the product listener instead would simply not be accepted.
#
# The Ingress stays in `platform-system` with the Envoy edge it points at,
# because an Ingress without a load-balancer address reports Progressing and
# would otherwise make this service's health depend on the Tailscale operator.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: saas-fabric-control-plane
spec:
  parentRefs:
    - name: platform
      namespace: platform-system
      sectionName: operator
  hostnames:
    - fabric.invalid
  rules:
    # The API the console calls, on its own origin.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: saas-fabric-control-plane
          port: 80

    # Everything else is the console's static bundle.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: saas-fabric-control-plane-ui
          port: 80
