# The control-plane API.
#
# Separate from the runtime plane's Deployment, and separate from the console's,
# because the three fail independently and belong on different networks. The
# runtime plane must keep serving tenants when this is down; that is only true
# if it is not this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-fabric-control-plane
spec:
  # One. The reconciliation loop is idempotent and a second replica would sweep
  # the same clients concurrently — harmless, because every operation is
  # idempotent, but it doubles the load on Keycloak and GitHub to no end. A
  # second replica is a leader-election decision, not a replica-count one.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: saas-fabric-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saas-fabric-control-plane
    spec:
      serviceAccountName: saas-fabric-control-plane

      # Mounted, and this is a deliberate change from `false`.
      #
      # The control plane authenticates to OpenBao with the pod's own
      # Kubernetes identity, which is what lets it hold no static credential
      # for the secret store — nothing to create, transport or rotate. That
      # identity is this token.
      #
      # It is the API's alone. The console container below keeps
      # `automountServiceAccountToken: false`, because a static file server has
      # no reason to hold an identity for anything.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true

        # 65532 is `nonroot` in the distroless base, stated numerically because
        # the kubelet cannot check a *name*. The image declares `USER nonroot`,
        # and with `runAsNonRoot: true` and no UID here the kubelet refuses to
        # start the container at all:
        #
        #   container has runAsNonRoot and image has non-numeric user
        #   (nonroot), cannot verify user is non-root
        #
        # It is not a warning and not a fallback -- the pod never runs. The
        # console beside this needs no such line because nginx-unprivileged
        # declares a numeric UID of its own, which is the whole difference.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: ghcr.io/fieldstatenz/saas-fabric-control-plane:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: FABRIC_CP_CONFIG
              value: /etc/fabric/control-plane.toml
            - name: RUST_LOG
              value: info
          # No `envFrom`, and no Secret behind it. **This deployment supplies
          # the control plane with no credential of any kind.**
          #
          # Git: the platform creates its own application when an operator
          # connects it, and writes the key into its own secret partition.
          #
          # Keycloak: the platform holds no authority over it. It acts as the
          # operator who asked, with the bearer they presented, so permission
          # to create a realm belongs to a person in the master realm.
          #
          # What remains is the service-account token below, which is an
          # identity rather than a credential somebody issued.
          volumeMounts:
            - name: config
              mountPath: /etc/fabric
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            # Deliberately the same endpoint, and deliberately not a check of
            # Git or Keycloak. An operator needs this API *most* when a backend
            # is failing — to see which clients are affected and why — so
            # tying readiness to a backend would remove the surface that
            # explains the outage. Per-client reconciliation status is the
            # signal for backend health, and it is in the API.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: saas-fabric-control-plane-config
