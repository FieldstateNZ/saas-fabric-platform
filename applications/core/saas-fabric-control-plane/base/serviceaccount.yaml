# The control plane's identity in the cluster.
#
# It has no RoleBinding, and that is the point: the control plane administers
# Keycloak and Git over the network, using credentials the platform delivers.
# It has no business reading anything from the Kubernetes API, so it is granted
# nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: saas-fabric-control-plane
automountServiceAccountToken: false
