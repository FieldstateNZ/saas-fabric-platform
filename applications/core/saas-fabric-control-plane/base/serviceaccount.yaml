# The control plane's identity in the cluster.
#
# It has no RoleBinding, and that is still the point: the control plane
# administers Keycloak and Git over the network and has no business reading
# anything from the Kubernetes API.
#
# What this identity *is* used for is OpenBao. The API exchanges this account's
# token for a store token through OpenBao's Kubernetes auth method, which is
# what lets the platform hold no static credential for its own secret
# partition. The OpenBao role is bound to this account's name and namespace, so
# the name here is load-bearing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: saas-fabric-control-plane

# The pods decide. The API mounts this token because it needs it; the console
# does not, and has its own account below so that it cannot acquire the
# capability by a later change flipping one field.
automountServiceAccountToken: false
---
# The console's identity, which exists in order to be powerless.
#
# It could have shared the account above — it mounts no token, so it could not
# use one today. But that account is now bound to an OpenBao role that can write
# this instance's private key, and "safe because a different field is false" is
# exactly the kind of safety that stops being true in a later diff.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: saas-fabric-control-plane-ui
automountServiceAccountToken: false
