apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-system

resources:
  - serviceaccount.yaml
  - deployment-api.yaml
  - service-api.yaml
  - deployment-ui.yaml
  - service-ui.yaml

# A generator rather than a plain resource, so the name carries a content hash.
# That hash is what rolls the Deployment when configuration changes — without
# it the pod keeps running with the file it started with, and an
# operator-allowlist edit appears applied when it is not.
configMapGenerator:
  - name: saas-fabric-control-plane-config
    files:
      - control-plane.toml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: saas-fabric
      fieldstate.nz/system: saas-fabric
      fieldstate.nz/layer: platform
