# ingress-nginx values shared by every environment.
# Environment differences live in environments/<env>/config/ingress.yaml.

fullnameOverride: ingress-nginx

controller:
  ingressClassResource:
    name: nginx
    enabled: true
    # Not the cluster default: platform Ingresses name the class explicitly, so
    # a second controller can coexist (k3s ships Traefik) without ambiguity.
    default: false
  ingressClass: nginx

  # Platform Ingresses are opt-in by class rather than by namespace, so the
  # controller must be able to watch namespaces the platform does not own yet.
  watchIngressWithoutClass: false

  admissionWebhooks:
    enabled: true

  config:
    # Keycloak sets large headers during the auth code flow.
    proxy-buffer-size: 16k
    use-forwarded-headers: "true"
    enable-real-ip: "true"

  metrics:
    enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

serviceAccount:
  create: true
