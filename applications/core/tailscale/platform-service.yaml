# Platform service contract. See docs/platform-services.md.
service: tailscale
deployment: adopted
required: false         # environments without an operator plane are complete
operatorUsage: true     # it is the operator plane
clientPartitioning:
  mode: none
  provisioning: unsupported
clientCapability:
  available: false
tenancy:
  status: rejected
  rationale: |
    Deliberate, not a limitation. The operator plane never carries product or
    client traffic; partitioning it for clients would be the boundary violation
    the two-plane design exists to prevent. See docs/architecture.md.
