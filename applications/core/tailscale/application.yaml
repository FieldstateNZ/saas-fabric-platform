apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale
  namespace: argocd
  labels:
    fieldstate.nz/source: helm
    fieldstate.nz/class: core
    fieldstate.nz/plane: operator
  annotations:
    # Wave 0, with Envoy Gateway. The operator supplies the `tailscale`
    # IngressClass that every operator-plane Ingress names, so it has to exist
    # before any of them.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: saas-fabric-platform

  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.102.3
      helm:
        releaseName: tailscale
        ignoreMissingValueFiles: true
        valueFiles:
          - $platform/applications/core/tailscale/values.yaml
          - $platform/environments/PLACEHOLDER/config/tailscale.yaml
    - repoURL: https://github.com/FieldstateNZ/saas-fabric-platform.git
      targetRevision: PLACEHOLDER
      ref: platform

  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        fieldstate.nz/system: saas-fabric
        fieldstate.nz/layer: platform
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
