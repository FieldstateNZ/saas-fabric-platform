# OpenTelemetry Collector values shared by every environment.
#
# This is the platform's telemetry boundary, not a telemetry product. Platform
# and client workloads emit OTLP here; where the data goes afterwards is an
# environment decision made in environments/<env>/config/observability.yaml.

fullnameOverride: observability-collector

mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib

presets:
  # Stamps pod, namespace and node metadata onto every signal so telemetry can
  # be attributed to a platform component or a client namespace. The preset
  # defines a processor named k8s_attributes and its RBAC; the pipelines below
  # place it deliberately, after memory_limiter rather than before it.
  kubernetesAttributes:
    enabled: true

config:
  receivers:
    # The chart defaults to also accepting Jaeger and Zipkin, which opens
    # container and service ports for receivers no pipeline uses. The platform's
    # telemetry contract is OTLP; removing the rest keeps the surface honest.
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318

  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch:
      timeout: 5s

  exporters:
    # Deliberately terminal. Each environment replaces this with its own
    # backend; nothing in the platform is coupled to a specific one.
    debug:
      verbosity: basic

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: [debug]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: [debug]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: [debug]

# Only the two OTLP ports are published, matching the receivers configured
# above. The chart also opens Jaeger and Zipkin ports by default; leaving them
# open for receivers that no longer exist would advertise an endpoint that
# accepts nothing.
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
