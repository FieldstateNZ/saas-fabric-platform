# Platform service contract. See docs/platform-services.md.
service: opentelemetry
deployment: adopted
required: true          # the telemetry boundary every service reports through
operatorUsage: false    # a pipeline, not a console -- Perses is the surface
controlPlane:
  # Infrastructure reconciled by Argo CD, with no operator-facing console.
  managed: false
  upstreamAdminSurface: none
clientPartitioning:
  mode: none
  provisioning: unsupported
clientCapability:
  available: false
tenancy:
  status: not-applicable
  rationale: |
    The collector is a transport boundary, not a service clients hold partitions
    in. It receives OTLP from platform workloads and forwards it; there is no
    per-client object inside it to own.

    This is a statement about its role today, not a permanent one. Per-client
    telemetry would need a client attribute enforced at ingest and a backend
    whose own tenancy model has been assessed -- at which point this becomes a
    real partitioning question rather than a category-wrong one. Recorded as a
    known gap in docs/architecture.md.
