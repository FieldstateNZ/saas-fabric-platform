apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# LucentRoot: k3s development / dogfood environment.
# Catalogue applications are enabled here so they are exercised before any
# production promotion is considered.
namespace: argocd

resources:
  - config
  - ../../argocd/projects
  - ../../argocd/runtime
  - ../../applications/core
  # Operator plane: private tailnet access for the people who run the platform.
  # Enabled per environment; production has no tailnet yet. See
  # docs/architecture.md#exposure-planes.
  - ../../applications/core/tailscale
  - ../../applications/core/operator-access
  - ../../applications/catalogue

components:
  - ../components/environment-config

# The Git ref this environment follows. LucentRoot tracks the integration
# stream, so a merge to main reconciles here automatically.
patches:
  - target:
      kind: Application
      labelSelector: fieldstate.nz/source=helm
    patch: |-
      - op: replace
        path: /spec/sources/1/targetRevision
        value: main
  - target:
      kind: Application
      labelSelector: fieldstate.nz/source=kustomize
    patch: |-
      - op: replace
        path: /spec/source/targetRevision
        value: main

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/managed-by: argocd
      fieldstate.nz/system: saas-fabric
      fieldstate.nz/layer: platform
