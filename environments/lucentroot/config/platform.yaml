# Environment contract for LucentRoot (k3s, development / dogfood).
#
# This is the only place LucentRoot's environmental facts are declared. It is
# applied at bootstrap and thereafter reconciled by Argo CD, so the cluster can
# always be asked which environment it is and which revision it tracks.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-environment
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
data:
  environment: lucentroot
  domain: lucentroot.internal
  replicaProfile: development
  storageClass: local-path
  # LucentRoot tracks the integration stream. Merges to main reconcile here.
  revision: main
