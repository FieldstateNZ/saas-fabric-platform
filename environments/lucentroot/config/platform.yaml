# Environment contract for LucentRoot (k3s, development / dogfood).
#
# Environmental facts only. Which Git ref Argo CD follows is part of this
# environment's Argo binding, not runtime configuration, and lives in
# ../kustomization.yaml and ../bootstrap/kustomization.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-environment
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
data:
  environment: lucentroot
  domain: lucentroot.internal
  replicaProfile: development
  storageClass: local-path
