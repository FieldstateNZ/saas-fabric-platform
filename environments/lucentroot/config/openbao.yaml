# LucentRoot: single-node Raft on local-path storage. Same storage engine as
# production, lower availability.
#
# Workloads reach OpenBao cluster-locally at
# openbao.secrets.svc.cluster.local:8200 and need no ingress at all. The tailnet
# hostname for administrators is rendered by applications/core/operator-access,
# not here -- see that directory for why.
server:
  ha:
    replicas: 1
  dataStorage:
    size: 4Gi
    storageClass: local-path
  auditStorage:
    size: 2Gi
    storageClass: local-path

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
