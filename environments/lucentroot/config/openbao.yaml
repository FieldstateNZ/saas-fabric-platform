# LucentRoot: single-node Raft on local-path storage. Same storage engine as
# production, lower availability.
#
# Operator plane only. Workloads reach OpenBao cluster-locally at
# openbao.secrets.svc.cluster.local:8200 and need no ingress at all; the tailnet
# hostname exists for the humans who administer it.
server:
  ha:
    replicas: 1
  dataStorage:
    size: 4Gi
    storageClass: local-path
  auditStorage:
    size: 2Gi
    storageClass: local-path

  ingress:
    enabled: true
    ingressClassName: tailscale
    pathType: Prefix
    hosts:
      - host: bao-lucentroot
        paths:
          - /
    tls:
      - hosts:
          - bao-lucentroot
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
