# LucentRoot: single-node Raft on local-path storage, and a disposable OpenBao
# that initialises and unseals itself.
#
# Nobody runs `bao operator init` or `bao operator unseal` here. Destroying
# LucentRoot destroys its OpenBao state and its seal key together; a rebuild
# creates a new, empty instance automatically. There is nothing to restore,
# which is what makes a disposable seal the right answer rather than a shortcut.
#
# Production does NOT share this. See environments/production/config/openbao.yaml.

# Static seal, keyed from a file the platform generates. Not an external KMS,
# deliberately: after a rebuild there is no prior data to decrypt, so an
# external trust root would be guarding nothing while adding a dependency the
# environment cannot satisfy.
sealStanza: |
  seal "static" {
    current_key_id = "lucentroot"
    current_key    = "file:///openbao/seal/key"
  }

# Everything the platform needs OpenBao to know, applied once at first start.
#
# Self-initialisation requires auto-unseal, generates no recovery shares, and
# revokes the root token rather than returning it -- so there is no key material
# for anyone to capture, and none needs to survive a rebuild.
#
# This establishes exactly the tenancy boundary the platform already documents:
# the External Secrets role can read secret/platform/* and nothing else.
# secret/clients/* stays unreadable from here and is created by client
# provisioning.
initializeStanza: |
  initialize "platform" {
    request "kv-mount" {
      operation = "update"
      path      = "sys/mounts/secret"
      data      = {
        type    = "kv"
        options = { version = "2" }
      }
    }

    request "kubernetes-auth" {
      operation = "update"
      path      = "sys/auth/kubernetes"
      data      = { type = "kubernetes" }
    }

    request "kubernetes-auth-config" {
      operation = "update"
      path      = "auth/kubernetes/config"
      data      = { kubernetes_host = "https://kubernetes.default.svc" }
    }

    request "platform-policy" {
      operation = "update"
      path      = "sys/policies/acl/platform-secrets"
      data      = {
        policy = <<-POLICY
          path "secret/data/platform/*"     { capabilities = ["read"] }
          path "secret/metadata/platform/*" { capabilities = ["read", "list"] }
        POLICY
      }
    }

    request "external-secrets-role" {
      operation = "update"
      path      = "auth/kubernetes/role/external-secrets"
      data      = {
        bound_service_account_names      = "external-secrets"
        bound_service_account_namespaces = "secrets"
        policies                         = "platform-secrets"
        ttl                              = "1h"
      }
    }

    # The human administrative path.
    #
    # Bootstrap surfaces no root token, so without a role here OpenBao has
    # exactly one identity -- External Secrets -- and nobody can read or write
    # secret/platform/* to operate the platform. The UI is reachable on the
    # operator plane and unusable, which is worse than not exposing it.
    #
    # Authority comes from a Kubernetes ServiceAccount rather than a stored
    # password, so there is still no standing credential to leak or rotate: an
    # operator mints a short-lived token with `kubectl create token` and
    # exchanges it here. Reaching the API to do that already requires the
    # tailnet and a cluster-admin binding, so this grants no path that
    # possessing those two does not already grant.
    #
    # See applications/core/operator-access/overlays/lucentroot for the
    # ServiceAccount and the binding.
    request "platform-admin-policy" {
      operation = "update"
      path      = "sys/policies/acl/platform-admin"
      data      = {
        policy = <<-POLICY
          path "*" {
            capabilities = ["create", "read", "update", "patch", "delete", "list", "sudo"]
          }
        POLICY
      }
    }

    request "operator-role" {
      operation = "update"
      path      = "auth/kubernetes/role/operator"
      data      = {
        bound_service_account_names      = "openbao-operator"
        bound_service_account_namespaces = "secrets"
        policies                         = "platform-admin"
        ttl                              = "1h"
      }
    }
  }
#
# Workloads reach OpenBao cluster-locally at
# openbao.secrets.svc.cluster.local:8200 and need no ingress at all. The tailnet
# hostname for administrators is rendered by applications/core/operator-access,
# not here -- see that directory for why.
server:
  ha:
    replicas: 1
  dataStorage:
    size: 4Gi
    storageClass: local-path
  auditStorage:
    size: 2Gi
    storageClass: local-path

  # The seal key, generated by applications/core/openbao-seal at wave 0. Mounted
  # rather than passed as an environment variable so the file holds the 32 raw
  # bytes AES-256 expects.
  volumes:
    - name: seal
      secret:
        secretName: openbao-seal
  volumeMounts:
    - name: seal
      mountPath: /openbao/seal
      readOnly: true

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
