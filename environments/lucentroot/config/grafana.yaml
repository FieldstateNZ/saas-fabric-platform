# LucentRoot: internal storage, operator plane only.
#
# Grafana reads platform telemetry and is an operations surface, not a product
# one. It has no HTTPRoute and never appears on the product edge.
persistence:
  storageClassName: local-path

ingress:
  enabled: true
  ingressClassName: tailscale
  hosts:
    - grafana-lucentroot
  tls:
    - hosts:
        - grafana-lucentroot
