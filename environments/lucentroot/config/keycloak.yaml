# LucentRoot: one replica.
#
# Keycloak is the clearest case of a service on both planes.
#
#   product plane   Envoy   /realms/ and /resources/ only — the OIDC endpoints
#                           applications actually call
#   operator plane  Tailscale  everything, including /admin
#
# The distinction is not "Keycloak is internal". Applications need its
# authentication endpoints on the product edge. It is the administrative console
# and admin API that have no reason to hang off it.
replicas: 1

# Product plane for tokens and redirects; operator plane for the console. The
# schemes genuinely differ, and the value must match the listener that serves
# it -- Keycloak puts this in the OIDC issuer, so claiming https over an HTTP
# listener breaks every client that checks.
#
#   http   the shared Gateway has one listener, http on 80, and Keycloak's
#          HTTPRoute attaches to it. Production adds an https listener and uses
#          it; LucentRoot has no certificate authority for *.lucentroot.internal
#   https  the Tailscale proxy terminates TLS with a tailnet certificate
hostnames:
  public: http://auth.lucentroot.internal
  admin: https://auth-lucentroot.tail5a7546.ts.net

httpRoute:
  enabled: true
  parentRefs:
    - name: platform
      namespace: platform-system
      sectionName: http
  hostnames:
    - auth.lucentroot.internal
  # Explicit rules rather than the chart default of a single "/" prefix, which
  # would put /admin on the product edge.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /realms
        - path:
            type: PathPrefix
            value: /resources
        - path:
            type: PathPrefix
            value: /.well-known

# Operator-plane access is NOT rendered here. It lives in
# applications/core/operator-access, because an Ingress without a load-balancer
# address reads as Progressing to Argo CD -- rendering one from this chart would
# make Keycloak's health depend on the Tailscale operator and gate every wave
# behind it. See docs/architecture.md#exposure-planes.

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi
