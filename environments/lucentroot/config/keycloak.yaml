# LucentRoot: one replica.
#
# Keycloak is the clearest case of a service on both planes.
#
#   product plane   Envoy   /realms/ and /resources/ only — the OIDC endpoints
#                           applications actually call
#   operator plane  nothing — the admin console is deliberately not published
#
# Applications need Keycloak's authentication endpoints on the product edge. Its
# administrative surface is reached by SaaS Fabric over the Admin REST API, so
# it needs no plane at all.
replicas: 1

# One hostname, because Keycloak now has one audience: applications.
#
# The value must match the listener that serves it -- Keycloak puts this in the
# OIDC issuer, so claiming https over an HTTP listener breaks every client that
# checks. LucentRoot's shared Gateway has a single http listener on 80.
#
# There is deliberately no admin hostname. SaaS Fabric administers Keycloak
# through its Admin REST API, cluster-locally; the upstream console is not part
# of the operator experience. See docs/architecture.md#the-administrative-control-plane.
hostnames:
  public: http://auth.lucentroot.internal

httpRoute:
  enabled: true
  parentRefs:
    - name: platform
      namespace: platform-system
      sectionName: http
  hostnames:
    - auth.lucentroot.internal
  # Explicit rules rather than the chart default of a single "/" prefix, which
  # would put /admin on the product edge.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /realms
        - path:
            type: PathPrefix
            value: /resources
        - path:
            type: PathPrefix
            value: /.well-known

# Operator-plane access is NOT rendered here. It lives in
# applications/core/operator-access, because an Ingress without a load-balancer
# address reads as Progressing to Argo CD -- rendering one from this chart would
# make Keycloak's health depend on the Tailscale operator and gate every wave
# behind it. See docs/architecture.md#exposure-planes.

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi
