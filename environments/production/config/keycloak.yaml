# Production: two replicas, public hostname, TLS terminated at the Gateway's
# https listener rather than by a certificate attached to this service.
#
# Product plane only, permanently. Keycloak's admin console is not published on
# any plane in any environment: SaaS Fabric is the administrative control plane
# and reaches Keycloak over its Admin REST API. Production therefore needs no
# Keycloak admin hostname, now or when a tailnet exists.
replicas: 2

hostnames:
  public: https://auth.fieldstate.nz

httpRoute:
  enabled: true
  parentRefs:
    - name: platform
      namespace: platform-system
      sectionName: https
  hostnames:
    - auth.fieldstate.nz
  # /admin is deliberately absent: the admin console does not belong on the
  # product edge. See docs/architecture.md#exposure-planes.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /realms
        - path:
            type: PathPrefix
            value: /resources
        - path:
            type: PathPrefix
            value: /.well-known

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 2Gi
