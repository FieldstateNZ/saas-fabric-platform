# RBAC for the step-3 PreSync hook. Created by step 1 so it exists before
# step 3's first hooked sync.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ordering-gate
  namespace: operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ordering-gate
  namespace: operator-system
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ordering-gate
  namespace: operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ordering-gate
subjects:
  - kind: ServiceAccount
    name: ordering-gate
    namespace: operator-system
