# Stand-in for master-instance-state. The live namespace has Prune=false and
# not Delete=false (ordered-updates.md R2). This stand-in carries both so V6
# can show the Secret surviving Application deletion.
apiVersion: v1
kind: Namespace
metadata:
  name: master-instance-state
  labels:
    fieldstate.nz/system: saas-fabric
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Secret
metadata:
  name: tfstate-default-master-instance
  namespace: master-instance-state
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
stringData:
  tfstate: '{"version":4,"serial":1,"lineage":"synthetic","outputs":{},"resources":[]}'
