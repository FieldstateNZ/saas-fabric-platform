# In-cluster git daemon for the throwaway repo. The kind node mounts the host
# bare repo at /git-host. Not part of any environment.
apiVersion: v1
kind: Namespace
metadata:
  name: git
---
apiVersion: v1
kind: Service
metadata:
  name: git
  namespace: git
spec:
  selector:
    app: git
  ports:
    - name: git
      port: 9418
      targetPort: 9418
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git
  namespace: git
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git
  template:
    metadata:
      labels:
        app: git
    spec:
      containers:
        - name: git
          image: quay.io/argoproj/argocd:v3.5.6
          imagePullPolicy: IfNotPresent
          command: ["git"]
          args:
            - daemon
            - --reuseaddr
            - --verbose
            - --export-all
            - --base-path=/git-host
            - --listen=0.0.0.0
            - --port=9418
            - /git-host
          env:
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: "*"
          ports:
            - containerPort: 9418
              name: git
          volumeMounts:
            - name: repo
              mountPath: /git-host
              readOnly: true
      volumes:
        - name: repo
          hostPath:
            path: /git-host
            type: Directory
