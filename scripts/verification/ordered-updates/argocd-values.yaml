# Helm values for the throwaway cluster only. Chart 10.11.6 (app v3.5.6),
# the same chart and app version lucentroot-gitops pins. Dex and notifications
# stay off, as they do there. The ApplicationSet controller is started (that
# repo sets replicas to 0) and progressive syncs are turned on, because the
# candidate does nothing without them.
nameOverride: argocd
global:
  image:
    imagePullPolicy: IfNotPresent
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 1
redis:
  image:
    imagePullPolicy: IfNotPresent
  exporter:
    enabled: false
configs:
  cm:
    timeout.reconciliation: 15s
    timeout.reconciliation.jitter: 0s
    admin.enabled: true
  params:
    server.insecure: "true"
    applicationsetcontroller.enable.progressive.syncs: "true"
controller:
  replicas: 1
repoServer:
  replicas: 1
server:
  replicas: 1
