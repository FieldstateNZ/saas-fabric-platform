extends: default

ignore: |
  .render/

rules:
  # Kubernetes manifests are wide by nature; readability is enforced by review,
  # not by a column count.
  line-length:
    max: 120
    allow-non-breakable-words: true
  comments:
    min-spaces-from-content: 1
  # Helm values files legitimately use "on"/"off"/"yes" as strings.
  truthy:
    check-keys: false
  document-start: disable
  # Charts are indented as their upstream documents them.
  indentation:
    indent-sequences: consistent
