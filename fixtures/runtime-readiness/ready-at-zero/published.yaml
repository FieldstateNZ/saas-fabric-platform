# Synthetic. Never applied: no Kustomization or Application references fixtures/.
# The three documents as the publisher writes them: one ConfigMap each, payload
# and manifest keys, managed-by saas-fabric. The tenants ConfigMap also holds
# publication.json, the record naming the revision and sha256 of every document
# in this generation (saas-fabric #136), the highest revision each resource was
# ever published at (saas-fabric #138), and contract 3 as the publisher's
# rollback floor (saas-fabric #139, raised to 3 by
# #140). A manifest keeps the contract it was written at until its document
# changes. issuer-registry.json is the issuer
# registry generation the record names with the sha256 of these exact bytes
# (saas-fabric #140).
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: fabric-runtime-tenants
    namespace: platform-system
    labels:
      app.kubernetes.io/managed-by: saas-fabric
  data:
    tenants.json: |
      [
        {
          "tenant": "alpha",
          "revision": 3,
          "data": {
            "primary": {
              "data_source": "alpha-primary",
              "isolation": {
                "kind": "database"
              }
            }
          },
          "features": {}
        },
        {
          "tenant": "beta",
          "revision": 1,
          "data": {
            "primary": {
              "data_source": "beta-primary",
              "isolation": {
                "kind": "database"
              }
            }
          },
          "features": {}
        }
      ]
    tenants.manifest.json: |
      {
        "contract_version": 3,
        "document": "tenants",
        "revision": 4
      }
    publication.json: |
      {
        "contract_version": 3,
        "minimum_reader_contract": 1,
        "minimum_publisher_contract": 3,
        "generation": 5,
        "documents": {
          "tenants": {
            "revision": 4,
            "sha256": "81072eb211538155ba9863644890a4111b7405cead62082fa6d0dd6fff3bb824"
          },
          "data-sources": {
            "revision": 3,
            "sha256": "4265e2ba06aadd5dde9f52b15223a8fa92d449ea15a485c8f719a5387b62f2f8"
          },
          "catalog": {
            "revision": 2,
            "sha256": "e8a551d331a1a59983e7344c55799c19ce39d9c1df80c0255e99cdb8e15046eb"
          }
        },
        "resources": {
          "tenants": {
            "alpha": 3,
            "beta": 1
          },
          "data-sources": {
            "alpha-primary": 2,
            "beta-primary": 1
          }
        },
        "registry": {
          "generation": 2,
          "sha256": "4d32b61d4fb355b1d0ba06492aac484aad06b543b77c47409f1715799e8346ca"
        }
      }
    issuer-registry.json: |
      {
        "schemaVersion": 1,
        "generation": 2,
        "issuers": [
          {
            "issuer": "https://identity.example.invalid/realms/alpha",
            "tenant": "alpha"
          },
          {
            "issuer": "https://identity.example.invalid/realms/beta",
            "tenant": "beta"
          }
        ]
      }
