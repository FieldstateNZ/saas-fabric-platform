# The contract-2 publisher for the migration fixture (../migration/). Not built
# by CI: it fetches the private saas-fabric repository at the commit
# ../PROVENANCE names for contract 2.
[package]
name = "publication-migration-harness"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
fabric-runtime-publication = { git = "https://github.com/FieldstateNZ/saas-fabric", rev = "ebf0c0b77e622313a2729aa0c87d7a73883f3712" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace]
